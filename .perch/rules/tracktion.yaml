- name: tracktion-edits-through-undo
  each: method
  where: Source/Engine/**/*.{cpp,h}
  min: 70
  ensure: >-
    Every change this method makes to a ValueTree or object that is already part
    of the Edit (setProperty, addChild, removeChild, inserting or removing a
    track, clip, plugin or automation point, setting a parameter value) passes
    the Edit's UndoManager, or a comment in or above the method says why it is
    not undoable (transport, the Loop, selection, zoom, scroll, a track's Input
    and arming — per CONTEXT.md Engine Undo). Passing nullptr for any other
    change to the Edit breaks this. Building a detached ValueTree that is added
    to the Edit afterwards with the UndoManager passes, and so does a method
    that changes nothing in the Edit.
- name: tracktion-lookups-checked
  each: method
  where: Source/Engine/**/*.{cpp,h}
  ensure: >-
    Every Tracktion lookup that can come back empty — findTrackForID,
    findClipForID, dynamic_cast to a track/plugin type, getVolumePlugin,
    getPluginsOfType(...)[0], pluginList[i], getAutomatableParameterByID, an
    EditItemID parsed from a string — is checked before it is dereferenced, and
    the not-found case returns a juce::Result, nullptr or std::nullopt the
    caller can see. Dereferencing one unchecked, or turning not-found into a
    silent success, breaks this.
  min: 70
