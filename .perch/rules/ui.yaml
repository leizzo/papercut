- name: ui-theme-tokens-only
  each: method
  where: Source/UI/**/*.{cpp,h}
  except: Source/UI/Theme/**/*.{cpp,h}
  min: 70
  ensure: >-
    Look only at colour values and numeric literals written directly in this
    method's body. A literal colour (juce::Colour (0x...), juce::Colours::red,
    Colour::fromRGB/fromFloatRGBA) or a literal font size, corner radius,
    padding or pixel size used for layout or drawing breaks this. Any named
    value passes wherever it is defined: Theme fields (theme.accent, radiusSm),
    LayoutMetrics fields, a constexpr in a *Metrics namespace, a named member or
    local. juce::Colours::transparentBlack, 0, 1 px hairlines, 0.5f centring and
    ratios like getWidth() / 2 pass.
- name: ui-changes-edit-through-commands
  each: method
  where: Source/UI/**/*.{cpp,h}
  min: 70
  ensure: >-
    Look only at calls this method makes on an Engine facade (the
    ApplicationModel, Mixer, PluginRack, Session, Automation or another class
    from Source/Engine, usually held as model, mixer, rack or plugins) or on a
    Tracktion object. If one of those calls changes the Edit (adds, removes,
    moves, renames or sets a value on a track, clip, note, plugin, send,
    parameter, tempo or transport-independent setting), this breaks: the UI must
    invoke a Command (commands.invoke (cmd::..., {...})) instead. Reading from a
    facade, calling methods on this component or its child components, writing
    UI State (a component's own state ValueTree) and selection pass. A method
    that makes no such call passes.
- name: ui-paint-only-draws
  each: method
  where: Source/UI/**/*.{cpp,h}
  ensure: >-
    If this method is paint, paintOverChildren or resized, it only lays out or
    draws from state already held by the component: it does not change the Edit
    or the model, invoke a Command, start timers, add/remove child components,
    call repaint, allocate large buffers, sort, read files or walk the whole
    Edit to find what to draw. Any other method passes.
  min: 70
- name: ui-timer-repaints-on-change
  each: method
  where: Source/UI/**/*.{cpp,h}
  ensure: >-
    If this method is a timerCallback, it repaints or re-lays out only when what
    it polls has changed since the last tick (compared against a stored previous
    value), and repaints the smallest region that changed. An unconditional
    repaint() of the whole component every tick breaks this. Any other method
    passes.
  min: 70
